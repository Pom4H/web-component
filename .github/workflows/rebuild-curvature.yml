name: Rebuild Curvature runtime

on:
  push:
    branches: [agent/curvature-arena]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curvature-arena
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild production artifact
        run: node tools/build.mjs
      - name: Commit generated runtime if needed
        run: |
          if git diff --quiet -- skein.min.js; then
            echo "skein.min.js already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skein.min.js
          git commit -m "Rebuild production runtime"
          git push origin HEAD:agent/curvature-arena
