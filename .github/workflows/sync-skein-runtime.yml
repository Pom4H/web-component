name: Sync Skein runtime

on:
  push:
    branches: [skein-0.5-opt]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: skein-0.5-opt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
      - name: Commit generated runtime
        run: |
          if git diff --quiet -- skein.min.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skein.min.js
          git commit -m 'build Skein 0.5 production runtime'
          git push origin HEAD:skein-0.5-opt
