name: TypeScript declarations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript 7
        run: npm install --no-save --ignore-scripts typescript@7.0.2
      - name: Check declaration contract
        run: >-
          npx tsc
          --noEmit
          --strict
          --target es2022
          --module esnext
          --moduleResolution bundler
          --lib es2022,dom
          test/typescript-contract.ts
