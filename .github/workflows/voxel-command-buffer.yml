name: Patch voxel command buffer

on:
  push:
    branches: [agent/voxel-sandbox]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/voxel-sandbox
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/.patch-voxel-command-buffer.mjs
      - name: Commit generated patch
        run: |
          if git diff --quiet -- examples/visualizer/scene.html; then
            echo "No scene patch needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add examples/visualizer/scene.html
          git commit -m "Queue voxel actions before fixed-step consumption"
          git push origin HEAD:agent/voxel-sandbox
