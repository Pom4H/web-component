name: Patch voxel epoch gate

on:
  push:
    branches: [agent/voxel-sandbox]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/voxel-sandbox
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/.patch-voxel-epoch.mjs
      - name: Commit patch and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add examples/visualizer/scene.html test/visualizer.mjs
          git rm tools/.patch-voxel-epoch.mjs .github/workflows/voxel-epoch-patch.yml
          git commit -m "Gate voxel commands on completed world epochs"
          git push origin HEAD:agent/voxel-sandbox
