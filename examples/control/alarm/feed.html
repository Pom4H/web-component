<script>
  /** @typedef {{ id:string, unitId:string, severity:'warning'|'alarm', message:string, acknowledged:boolean }} Alarm */
  input('alarms', /** @type {Alarm[]} */ ([]))
</script>

<section>
  <header><span>Active events</span><b>{alarms.length}</b></header>
  <article each={alarms} key={id} data-severity={severity}>
    <code>{id}</code>
    <strong>{unitId}</strong>
    <span>{message}</span>
    <small>{severity}</small>
  </article>
</section>
