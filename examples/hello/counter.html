<script>
  this.count = 0
  this.increment = () => this.count++
  this.decrement = () => this.count--
</script>

<main --turn={count}>
  <p>HELLO / SKEIN</p>
  <strong>{count}</strong>
  <div>
    <button @click={decrement} aria-label="Decrease count">−</button>
    <button @click={increment} aria-label="Increase count">+</button>
  </div>
</main>
