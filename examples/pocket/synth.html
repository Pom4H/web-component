<script>
  input('wave', 'sawtooth')
  input('volume', .18)
  this.audioState = 'tap a key to enable audio'
  this.notes = [
    { id:'c4', label:'C', key:'A', freq:261.63, active:false },
    { id:'d4', label:'D', key:'S', freq:293.66, active:false },
    { id:'e4', label:'E', key:'D', freq:329.63, active:false },
    { id:'f4', label:'F', key:'F', freq:349.23, active:false },
    { id:'g4', label:'G', key:'G', freq:392.00, active:false },
    { id:'a4', label:'A', key:'H', freq:440.00, active:false },
    { id:'b4', label:'B', key:'J', freq:493.88, active:false },
    { id:'c5', label:'C', key:'K', freq:523.25, active:false }
  ]
  this.playing = computed(() => this.notes.filter(note => note.active).map(note => note.label).join(' · ') || 'ready')
  let audio, audioReady, pointerReset, pointerSequence = false, disposed = false
  const voices = new Map()
  const held = new Set()
  const starting = new Set()
  const pendingRelease = new Set()
  const releaseTimers = new Map()
  const Audio = globalThis.AudioContext || globalThis.webkitAudioContext

  const emit = (type, detail) => host.dispatchEvent(new CustomEvent(type, { detail, bubbles:true, composed:true }))
  const syncAudioState = () => {
    if (!audio || disposed) return
    this.audioState = audio.state === 'running' ? 'audio on' : audio.state === 'suspended' ? 'tap a key to enable audio' : 'audio ' + audio.state
  }
  const audioError = error => {
    if (disposed) return null
    this.audioState = 'audio blocked'
    emit('audio-error', { message:error?.message || String(error) })
    return null
  }
  const context = async () => {
    if (!Audio) {
      this.audioState = 'Web Audio unavailable'
      return null
    }
    if (!audio) {
      try { audio = new Audio({ latencyHint:'interactive' }) }
      catch (error) { return audioError(error) }
      audio.addEventListener('statechange', syncAudioState, { signal:abortSignal })
    }
    if (audio.state !== 'running') {
      this.audioState = 'enabling audio…'
      if (!audioReady) {
        try {
          // Calling resume here is synchronous with pointerdown/keydown. Oscillators
          // are created only after the browser confirms that the context is running.
          audioReady = audio.resume().then(() => {
            audioReady = null
            if (audio.state !== 'running') throw new Error('AudioContext did not start')
            syncAudioState()
            return audio
          }, error => {
            audioReady = null
            throw error
          })
        } catch (error) {
          audioReady = null
          return audioError(error)
        }
      }
      try { return await audioReady }
      catch (error) { return audioError(error) }
    }
    syncAudioState()
    return audio
  }
  const start = async note => {
    if (!note) return
    held.add(note.id)
    pendingRelease.delete(note.id)
    const releaseTimer = releaseTimers.get(note.id)
    if (releaseTimer) {
      clearTimeout(releaseTimer)
      releaseTimers.delete(note.id)
    }
    if (voices.has(note.id) || starting.has(note.id)) return
    starting.add(note.id)
    const ctx = await context()
    starting.delete(note.id)
    const releaseAfterStart = pendingRelease.delete(note.id)
    if (!ctx || disposed || abortSignal.aborted || voices.has(note.id) || (!held.has(note.id) && !releaseAfterStart)) {
      held.delete(note.id)
      return
    }
    try {
      const osc = ctx.createOscillator()
      const gain = ctx.createGain()
      const level = Math.max(.001, Math.min(.6, Number(this.volume) || 0))
      osc.type = this.wave
      osc.frequency.value = note.freq
      gain.gain.setValueAtTime(.0001, ctx.currentTime)
      gain.gain.exponentialRampToValueAtTime(level, ctx.currentTime + .018)
      osc.connect(gain).connect(ctx.destination)
      osc.addEventListener?.('ended', () => {
        try { osc.disconnect(); gain.disconnect() }
        catch {}
      }, { once:true })
      osc.start()
      voices.set(note.id, { osc, gain })
      note.active = true
      emit('note', { note:note.label, id:note.id, frequency:note.freq, velocity:level })
      if (releaseAfterStart) {
        // A quick first tap commonly ends before AudioContext.resume() resolves.
        // Play a short audible note instead of consuming that gesture silently.
        const timer = setTimeout(() => {
          releaseTimers.delete(note.id)
          stop(note)
        }, 20)
        releaseTimers.set(note.id, timer)
      }
    } catch (error) {
      held.delete(note.id)
      starting.delete(note.id)
      pendingRelease.delete(note.id)
      audioError(error)
    }
  }
  const stop = note => {
    if (!note) return
    held.delete(note.id)
    const voice = voices.get(note.id)
    if (!voice) {
      if (starting.has(note.id)) pendingRelease.add(note.id)
      return
    }
    const now = audio.currentTime
    try {
      voice.gain.gain.cancelScheduledValues(now)
      voice.gain.gain.setValueAtTime(Math.max(voice.gain.gain.value,.0001), now)
      voice.gain.gain.exponentialRampToValueAtTime(.0001, now + .08)
      voice.osc.stop(now + .09)
    } catch {}
    voices.delete(note.id)
    note.active = false
  }
  const byId = event => this.notes.find(note => note.id === event.currentTarget.dataset.id)
  this.down = event => {
    pointerSequence = true
    clearTimeout(pointerReset)
    event.currentTarget.setPointerCapture?.(event.pointerId)
    start(byId(event))
  }
  this.up = event => {
    stop(byId(event))
    clearTimeout(pointerReset)
    pointerReset = setTimeout(() => pointerSequence = false, 0)
  }
  this.activate = event => {
    // Native keyboard/assistive button activation emits click without pointer
    // events. Pointer clicks already used down/up and must not retrigger here.
    if (pointerSequence) {
      pointerSequence = false
      clearTimeout(pointerReset)
      return
    }
    const note = byId(event)
    start(note)
    stop(note)
  }
  this.changeWave = event => {
    this.wave = event.currentTarget.value
    emit('wave-change', { wave:this.wave })
  }

  window.addEventListener('keydown', event => {
    const target = event.target
    if (event.repeat || event.metaKey || event.ctrlKey || event.altKey || target?.matches?.('input,select,textarea') || target?.isContentEditable) return
    const note = this.notes.find(note => note.key === event.key.toUpperCase())
    if (!note) return
    event.preventDefault()
    start(note)
  }, { signal:abortSignal })
  window.addEventListener('keyup', event => {
    const note = this.notes.find(note => note.key === event.key.toUpperCase())
    if (note) stop(note)
  }, { signal:abortSignal })
  onCleanup(() => {
    disposed = true
    clearTimeout(pointerReset)
    held.clear()
    starting.clear()
    pendingRelease.clear()
    for (const timer of releaseTimers.values()) clearTimeout(timer)
    releaseTimers.clear()
    for (const note of this.notes) stop(note)
    try { audio?.close()?.catch(() => {}) }
    catch {}
  })
</script>

<section class="synth">
  <header>
    <div><small>SKEIN / WEB AUDIO</small><h1>POLY–8</h1></div>
    <label>WAVE
      <select .value={wave} @change={changeWave}>
        <option value="sine">sine</option><option value="triangle">triangle</option>
        <option value="square">square</option><option value="sawtooth">sawtooth</option>
      </select>
    </label>
  </header>
  <div class="display"><i></i><span>{playing}</span><em>{audioState}</em></div>
  <div class="keys">
    <button each={notes} key={id} data-id={id} data-active={active}
      @pointerdown={down} @pointerup={up} @pointercancel={up} @lostpointercapture={up} @click={activate}>
      <kbd>{key}</kbd><strong>{label}</strong><small>{freq}</small>
    </button>
  </div>
  <p>play with pointer or A S D F G H J K</p>
</section>

  label { display:grid; gap:5px; font:700 9px ui-monospace,monospace; letter-spacing:.1em; }
  select { border:1px solid #111; background:transparent; padding:6px; }
  .display { margin:22px 0 12px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; padding:9px 11px; border:1px solid #111; font:11px ui-monospace,monospace; text-transform:uppercase; }
  .display i { width:7px; aspect-ratio:1; border-radius:50%; background:#ff4d37; box-shadow:0 0 14px #ff4d37; }
  .display em { font-style:normal; opacity:.5; font-size:9px; }
  .keys { display:grid; grid-template-columns:repeat(8,1fr); height:190px; border:2px solid #111; border-right:0; }
  .keys button { position:relative; min-width:0; border:0; border-right:2px solid #111; background:#f8f5e9; color:#111; cursor:pointer; touch-action:none; transition:transform 40ms,background 40ms; }
  .keys button[data-active="true"] { background:#ff5d49; transform:translateY(5px); }
  kbd { position:absolute; top:10px; left:50%; translate:-50% 0; font:700 9px ui-monospace,monospace; border:1px solid #111; border-radius:50%; width:22px; aspect-ratio:1; display:grid; place-items:center; }
  .keys strong { position:absolute; bottom:28px; left:0; right:0; font-size:22px; }
  .keys small { position:absolute; bottom:9px; left:0; right:0; font:8px ui-monospace,monospace; opacity:.45; }
  p { margin:10px 0 0; font:700 9px ui-monospace,monospace; letter-spacing:.08em; text-align:right; }
  @media(max-width:600px){.synth{padding:14px}.display{grid-template-columns:auto 1fr}.display em{grid-column:2}.keys{height:160px}.keys strong{font-size:17px}.keys small{display:none}}
</style>
