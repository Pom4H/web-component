<script>input('project', { id:'—', name:'', owner:'', progress:0, health:'' })</script>
<div class="row" data-health={project.health}>
  <div class="id">{project.id}</div>
  <div class="copy"><strong>{project.name}</strong><small>{project.owner}</small></div>
  <div class="progress"><span>{project.progress}%</span><meter min="0" max="100" value={project.progress}></meter></div>
</div>
<style>
  :host{display:block}.row{min-height:54px;display:grid;grid-template-columns:52px minmax(0,1fr) 110px;gap:12px;align-items:center;border-bottom:1px solid #262a26}.row:last-child{border-bottom:0}.id,small,.progress span{font:600 9px ui-monospace,monospace;color:#747a73}.copy{display:grid;gap:3px}.copy strong{font-size:12px}.progress{display:grid;grid-template-columns:32px 1fr;align-items:center;gap:6px}meter{width:100%;height:5px;accent-color:#d7ff58}.row[data-health="watch"] meter{accent-color:#ffcb66}
</style>
