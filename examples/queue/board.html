<script>
  this.searchId = 'queue-filter'
  this.query = ''
  this.jobs = [
    { id:'A-17', title:'Pressure drop / north loop', owner:'Mina', priority:'hot', eta:'04m' },
    { id:'C-04', title:'Validate camera calibration', owner:'Iris', priority:'normal', eta:'12m' },
    { id:'B-29', title:'Deploy edge ruleset', owner:'Noah', priority:'normal', eta:'18m' },
    { id:'F-08', title:'Inspect vibration spike', owner:'Lio', priority:'hot', eta:'27m' }
  ]

  this.visible = computed(() => {
    const q = this.query.trim().toLowerCase()
    return q ? this.jobs.filter(job => `${job.id} ${job.title} ${job.owner}`.toLowerCase().includes(q)) : this.jobs
  })
  this.count = computed(() => `${this.visible.length}/${this.jobs.length}`)
  this.search = event => this.query = event.currentTarget.value
  this.rotate = () => {
    if (this.jobs.length > 1) this.jobs.unshift(this.jobs.pop())
  }
  this.raise = event => {
    const index = this.jobs.findIndex(job => job.id === event.currentTarget.dataset.id)
    if (index < 1) return
    const [job] = this.jobs.splice(index, 1)
    this.jobs.splice(index - 1, 0, job)
  }
</script>

<section class="board">
  <header>
    <div><small>KEYED DOM / NATIVE FORM</small><h1>QUEUE</h1></div>
    <div class="tools">
      <label for={searchId}>FILTER</label>
      <input id={searchId} .value={query} @input={search} placeholder="id, task, owner">
      <button @click={rotate}>rotate ↓</button>
    </div>
  </header>

  <div class="summary"><span>ACTIVE {count}</span><span>type a local note, then reorder</span></div>

  <div class="jobs">
    <article each={visible} key={id} data-priority={priority}>
      <div class="rank"><b>{index}</b><span>{id}</span></div>
      <div class="copy"><strong>{title}</strong><small>{owner} · ETA {eta}</small></div>
      <input class="note" placeholder="local DOM note…">
      <button class="up" data-id={id} @click={raise}>↑</button>
    </article>
  </div>
</section>
