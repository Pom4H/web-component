<script>
  this.playing = false
  this.bpm = 112
  this.step = 0
  this.pattern = [true,false,true,false,true,true,false,true]
  this.wave = 'sawtooth'
  this.volume = .18
  this.note = '—'
  this.level = 0

  this.transport = event => this.playing = event.detail.playing
  this.tempo = event => this.bpm = event.detail.bpm
  this.tick = () => this.step = (this.step + 1) % this.pattern.length
  this.patternChange = event => this.pattern = event.detail.pattern
  this.mix = event => this[event.detail.name] = event.detail.value
  this.waveChange = event => this.wave = event.detail.wave

  let decay
  this.noteOn = event => {
    this.note = event.detail.note
    this.level = event.detail.velocity
    clearTimeout(decay)
    decay = setTimeout(() => this.level = 0, 180)
  }
  onCleanup(() => clearTimeout(decay))
</script>

<section class="studio">
  <header class="mast">
    <div><small>COMPOSITION / NATIVE CUSTOM ELEMENTS</small><h1>SKEIN STUDIO</h1></div>
    <div class="readout"><span>{note}</span><b>{bpm} BPM</b></div>
  </header>

  <studio-transport .playing={playing} .bpm={bpm} @transport-change={transport} @tempo-change={tempo} @tick={tick}></studio-transport>
  <studio-sequencer .pattern={pattern} .step={step} @pattern-change={patternChange}></studio-sequencer>

  <div class="lower">
    <pocket-synth .wave={wave} .volume={volume} @wave-change={waveChange} @note={noteOn}></pocket-synth>
    <aside>
      <studio-mixer .wave={wave} .volume={volume} @mix-change={mix}></studio-mixer>
      <studio-scope .level={level} .note={note}></studio-scope>
    </aside>
  </div>
</section>

  .readout span { color:#d8ff58; font-size:22px; }
  studio-transport, studio-sequencer, pocket-synth, studio-mixer, studio-scope { display:block; }

</style>
