<script>
  this.level = input('level', 0)
  this.note = input('note', '—')
  let frame, phase = 0
  queueMicrotask(() => {
    const canvas = host.shadowRoot.querySelector('canvas')
    const ctx = canvas.getContext('2d')
    const draw = () => {
      phase += .035
      const level = Number(this.level) || 0
      ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0,0,360,150)
      ctx.strokeStyle = '#d8ff58'; ctx.lineWidth = 2; ctx.beginPath()
      for (let x=0;x<=360;x+=3) {
        const y = 75 + Math.sin(x*.055 + phase) * (12 + level*130) * Math.exp(-x/520)
        if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y)
      }
      ctx.stroke()
      ctx.fillStyle = '#9b8aff'; ctx.font = '10px monospace'; ctx.fillText(String(this.note), 12, 18)
      frame = requestAnimationFrame(draw)
    }
    draw()
  })
  onCleanup(() => cancelAnimationFrame(frame))
</script>

<canvas width="360" height="150"></canvas>

<style>
  :host { display:block; background:#0d0d0d; border:1px solid #4a4843; }
  canvas { display:block; width:100%; height:100%; min-height:140px; }
</style>
