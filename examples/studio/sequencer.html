<script>
  input('pattern', [true,false,true,false,true,true,false,true])
  input('step', 0)
  this.cells = computed(() => this.pattern.map((active, index) => ({ id:index, active, current:index === this.step, label:String(index + 1).padStart(2,'0') })))
  this.toggle = event => {
    const index = Number(event.currentTarget.dataset.index)
    const pattern = [...this.pattern]
    pattern[index] = !pattern[index]
    host.dispatchEvent(new CustomEvent('pattern-change', { detail:{ pattern }, bubbles:true, composed:true }))
  }
</script>

<section>
  <header><span>STEP SEQUENCER</span><small>keyed rows / property input</small></header>
  <div class="steps">
    <button each={cells} key={id} data-index={id} data-active={active} data-current={current} @click={toggle}>
      <i></i><b>{label}</b>
    </button>
  </div>
</section>

  :host { display:block; background:#252424; color:#f5f1e7; font-family:system-ui,sans-serif; }
