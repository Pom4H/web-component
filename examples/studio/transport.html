<script>
  input('playing', false)
  input('bpm', 112)
  const emit = (type, detail={}) => host.dispatchEvent(new CustomEvent(type, { detail, bubbles:true, composed:true }))
  this.toggle = () => emit('transport-change', { playing:!this.playing })
  this.changeTempo = event => emit('tempo-change', { bpm:Number(event.currentTarget.value) })

  let last = performance.now(), elapsed = 0
  const timer = setInterval(() => {
    const now = performance.now()
    if (!this.playing) { last = now; elapsed = 0; return }
    elapsed += now - last
    last = now
    const beat = 60000 / Math.max(40, Number(this.bpm) || 112) / 2
    if (elapsed >= beat) { elapsed %= beat; emit('tick') }
  }, 24)
  onCleanup(() => clearInterval(timer))
</script>

<section>
  <button data-playing={playing} @click={toggle}><i></i><b>{playing}</b></button>
  <div class="rail"><span>TRANSPORT</span><strong>{bpm}</strong></div>
  <label>BPM <input type="range" min="70" max="160" .value={bpm} @input={changeTempo}></label>
</section>
