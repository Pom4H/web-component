<script>
  input('task', { id:'—', name:'', owner:'', project:'', priority:'' })
  this.open = () => host.dispatchEvent(new CustomEvent('select-task', { detail:{ id:this.task.id }, bubbles:true, composed:true }))
</script>

<button data-priority={task.priority} @click={open}>
  <div><span>{task.id}</span><span>{task.project}</span></div>
  <strong>{task.name}</strong>
  <small>{task.owner}</small>
</button>

<style>
  :host{display:block}button{width:100%;border:1px solid #2a2f2a;background:#161a16;color:#ece9e0;padding:9px;text-align:left;display:grid;gap:7px;cursor:pointer}button:hover{border-color:#596158}button[data-priority="high"]{box-shadow:inset 2px 0 #ff6b55}button div{display:flex;justify-content:space-between;color:#747a73;font:600 8px ui-monospace,monospace}strong{font:650 11px/1.3 system-ui}small{color:#8f958e;font:600 8px ui-monospace,monospace;text-transform:uppercase}
</style>
