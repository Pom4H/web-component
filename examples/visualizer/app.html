<script>
  this.steps = [
    { id:1, title:'component.html', kicker:'author', detail:'Plain HTML owns script, markup and style. No build graph is required before the browser sees the component.', api:'HTML file', color:'#5b8cff' },
    { id:2, title:'parse + compile once', kicker:'compile', detail:'Skein parses the component source once and turns strict bindings into precise effects over real DOM nodes.', api:'compile once', color:'#42d9ff' },
    { id:3, title:'real DOM clone', kicker:'mount', detail:'A component instance clones real DOM. There is no virtual tree waiting to be diffed after state changes.', api:'Shadow DOM', color:'#45e0c2' },
    { id:4, title:'reactive reads', kicker:'track', detail:'Bindings subscribe only to the properties they actually read, so unrelated state does not wake unrelated work.', api:'Proxy reads', color:'#7af29a' },
    { id:5, title:'dependency graph', kicker:'react', detail:'Fine-grained dependencies connect state properties directly to the DOM effects that consume them.', api:'property → effect', color:'#9af66a' },
    { id:6, title:'state write', kicker:'mutate', detail:'Ordinary object and array writes invalidate only subscribers attached to the changed property.', api:'this.count++', color:'#ff9d58' },
    { id:7, title:'one microtask', kicker:'schedule', detail:'Synchronous writes coalesce into one render wave before user effects run.', api:'queueMicrotask()', color:'#c27bff' },
    { id:8, title:'exact DOM writes + effects', kicker:'commit', detail:'Skein writes the exact text, attribute, property or CSS declaration that changed, then runs user effects.', api:'DOM commit', color:'#8b6dff' }
  ]
  this.selected = 0
  this.running = true
  this.speed = 1
  this.energy = .68
  this.burst = 0
  this.current = computed(() => this.steps[this.selected])

  this.select = event => {
    this.selected = Number(event.detail.index) || 0
    this.energy = .45 + (this.selected % 4) * .12
  }
  this.runChange = event => this.running = event.detail.running
  this.speedChange = event => this.speed = event.detail.speed
  this.energyChange = event => this.energy = event.detail.energy
  this.write = () => {
    this.burst++
    this.energy = .96
  }
</script>

<visualizer-shell>
  <header slot="mast" class="mast">
    <div>
      <small>REACTIVE MATTER / WEBGL2 / NATIVE COMPOSITION</small>
      <h1>TOUCH THE GRAPH.</h1>
    </div>
    <p>The field is the runtime: reads weave dependencies, writes disturb only connected fibers, microtasks collapse activity into one wavefront and the pulse finishes in a real DOM text node.</p>
  </header>

  <visualizer-scene slot="scene"
    .steps={steps}
    .selected={selected}
    .running={running}
    .speed={speed}
    .burst={burst}
    --energy={energy}
    @step-select={select}
    @energy-change={energyChange}>
  </visualizer-scene>

  <visualizer-controls slot="controls"
    .running={running}
    .speed={speed}
    @run-change={runChange}
    @speed-change={speedChange}
    @write={write}>
  </visualizer-controls>

  <visualizer-inspector slot="inspector"
    .step={current}
    .running={running}
    .speed={speed}>
  </visualizer-inspector>
</visualizer-shell>
