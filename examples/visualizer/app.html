<script>
  /** @typedef {{ id:string, transform:{ position:[number,number,number] }, body?:{ velocity:[number,number,number], radius:number }, field?:{ kind:'gravity'|'repulsor'|'vortex', strength:number, radius:number }, controller?:{ thrust:number }, collectible?:{ value:number, respawnRadius:number }, render:{ color:string, size:number } }} Entity */
  /** @typedef {{ id:'input'|'forces'|'integrate'|'bounds'|'collect', phase:'fixed', reads:string[], writes:string[] }} SystemSpec */
  /** @typedef {{ fixedHz:number, arenaRadius:number, drag:number, restitution:number, maxSpeed:number, pickupRadius:number }} Rules */
  /** @typedef {{ entities:Entity[], systems:SystemSpec[], rules:Rules }} World */
  /** @typedef {{ score:number, speed:number, contacts:number, simTime:number, thrust:number, position:{x:number,y:number,z:number} }} Telemetry */

  this.world = /** @type {World} */ ({
    entities:[
      {
        id:'PLAYER',
        transform:{ position:[0,.15,3.5] },
        body:{ velocity:[1.8,.25,-.45], radius:.18 },
        controller:{ thrust:7.5 },
        render:{ color:'#fff7d6', size:18 }
      },
      {
        id:'POND',
        transform:{ position:[-2.8,.7,-.5] },
        field:{ kind:'gravity', strength:14, radius:.72 },
        render:{ color:'#58aee8', size:30 }
      },
      {
        id:'BREEZE',
        transform:{ position:[1.6,-.5,.2] },
        field:{ kind:'vortex', strength:9.5, radius:.82 },
        render:{ color:'#9b7bd8', size:34 }
      },
      {
        id:'HILL',
        transform:{ position:[3.4,1.2,-1.4] },
        field:{ kind:'repulsor', strength:11, radius:.68 },
        render:{ color:'#e9784d', size:28 }
      },
      { id:'B-01', transform:{position:[-3.9,-1.4,2.1]}, collectible:{value:1,respawnRadius:.78}, render:{color:'#ffd54f',size:8} },
      { id:'B-02', transform:{position:[-1.4,2.4,-3.2]}, collectible:{value:1,respawnRadius:.78}, render:{color:'#ffd54f',size:8} },
      { id:'B-03', transform:{position:[2.8,-2.1,2.6]}, collectible:{value:1,respawnRadius:.78}, render:{color:'#ffd54f',size:8} },
      { id:'B-04', transform:{position:[4.1,.3,.8]}, collectible:{value:1,respawnRadius:.78}, render:{color:'#ffd54f',size:8} },
      { id:'B-05', transform:{position:[.6,3.4,1.7]}, collectible:{value:1,respawnRadius:.78}, render:{color:'#ffd54f',size:8} },
      { id:'B-06', transform:{position:[-2.1,-2.8,-2.4]}, collectible:{value:1,respawnRadius:.78}, render:{color:'#ffd54f',size:8} }
    ],
    systems:[
      { id:'input', phase:'fixed', reads:['controller'], writes:['intent'] },
      { id:'forces', phase:'fixed', reads:['transform','body','field','intent'], writes:['acceleration'] },
      { id:'integrate', phase:'fixed', reads:['acceleration','body'], writes:['transform','body'] },
      { id:'bounds', phase:'fixed', reads:['transform','body'], writes:['transform','body','contacts'] },
      { id:'collect', phase:'fixed', reads:['transform','collectible'], writes:['score','transform'] }
    ],
    rules:{
      fixedHz:120,
      arenaRadius:6.4,
      drag:.16,
      restitution:.76,
      maxSpeed:8.5,
      pickupRadius:.5
    }
  })
  this.running = true
  this.timeScale = 1
  this.fieldScale = 1
  this.resetToken = 0
  this.telemetry = /** @type {Telemetry} */ ({
    score:0, speed:0, contacts:0, simTime:0, thrust:0,
    position:{ x:0, y:0, z:0 }
  })

  this.runChange = event => this.running = event.detail.running
  this.timeScaleChange = event => this.timeScale = event.detail.value
  this.fieldScaleChange = event => this.fieldScale = event.detail.value
  this.reset = () => this.resetToken++
  this.telemetryChange = event => this.telemetry = event.detail
</script>

<visualizer-shell>
  <header slot="mast" class="mast">
    <small>SKEIN / ENTITY + COMPONENTS + SYSTEMS / WEBGL2</small>
    <h1>VOXEL<br>MEADOW.</h1>
    <p>
      A bright little sandbox whose world is declared as data. Move a cube through gravity, breeze and hill fields,
      collect sun blocks and watch the same typed system graph drive physics, input and rendering.
    </p>
  </header>

  <visualizer-scene
    slot="scene"
    .world={world}
    .running={running}
    .timeScale={timeScale}
    .fieldScale={fieldScale}
    .resetToken={resetToken}
    @world-telemetry={telemetryChange}>
  </visualizer-scene>

  <visualizer-controls
    slot="controls"
    .running={running}
    .timeScale={timeScale}
    .fieldScale={fieldScale}
    @run-change={runChange}
    @time-scale-change={timeScaleChange}
    @field-scale-change={fieldScaleChange}
    @world-reset={reset}>
  </visualizer-controls>

  <visualizer-inspector
    slot="inspector"
    .telemetry={telemetry}
    .world={world}>
  </visualizer-inspector>
</visualizer-shell>

  :host { display:block; min-height:100vh; background:#bfe5ff; color:#26332a; font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
  * { box-sizing:border-box; }
  .mast { min-width:0; }
  small { display:block; color:#39724a; font:800 9px/1.2 ui-monospace,SFMono-Regular,monospace; letter-spacing:.18em; }
  h1 { margin:9px 0 0; max-width:12ch; color:#243526; font:900 clamp(38px,5vw,74px)/.82 Arial Black,Impact,sans-serif; letter-spacing:-.075em; text-shadow:0 2px #fff8; }
  p { max-width:650px; margin:14px 0 0; color:#53695a; font-size:12px; line-height:1.58; }
  visualizer-scene, visualizer-controls, visualizer-inspector { display:block; min-width:0; }
  @media(max-width:700px){h1{font-size:clamp(36px,11vw,58px)}p{display:none}}
</style>
