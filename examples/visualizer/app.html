<script>
  /** @typedef {'grass'|'dirt'|'stone'|'wood'|'leaf'|'plank'} BlockKind */
  /** @typedef {{ seed:number, size:number, maxHeight:number }} VoxelWorld */
  /** @typedef {{ velocity:[number,number,number], halfWidth:number, halfHeight:number }} Body */
  /** @typedef {{ moveSpeed:number, jumpSpeed:number }} Controller */
  /** @typedef {{ dirt:number, stone:number, wood:number, plank:number }} Inventory */
  /** @typedef {{ id:string, transform?:{position:[number,number,number]}, body?:Body, controller?:Controller, inventory?:Inventory, voxelWorld?:VoxelWorld }} Entity */
  /** @typedef {{ id:'input'|'gravity'|'locomotion'|'voxel-collision'|'interact', phase:'fixed', reads:string[], writes:string[] }} SystemSpec */
  /** @typedef {{ id:'planks', input:{wood:number}, output:{plank:number} }} Recipe */
  /** @typedef {{ fixedHz:number, gravity:number, maxFall:number, reach:number }} Rules */
  /** @typedef {{ entities:Entity[], systems:SystemSpec[], recipes:Recipe[], rules:Rules }} World */
  /** @typedef {{ x:number, z:number }} GameControls */
  /** @typedef {{ jump:number, mine:number, place:number, craft:number }} GameActions */
  /** @typedef {{ position:{x:number,y:number,z:number}, speed:number, grounded:boolean, blocks:number, target:string, inventory:Inventory, crafted:number, message:string }} Telemetry */

  this.world = /** @type {World} */ ({
    entities:[
      {
        id:'PLAYER',
        transform:{ position:[.5,0,.5] },
        body:{ velocity:[0,0,0], halfWidth:.31, halfHeight:.88 },
        controller:{ moveSpeed:4.3, jumpSpeed:7.4 },
        inventory:{ dirt:3, stone:0, wood:2, plank:0 }
      },
      {
        id:'TERRAIN',
        voxelWorld:{ seed:1337, size:28, maxHeight:7 }
      }
    ],
    systems:[
      { id:'input', phase:'fixed', reads:['controller','controls','actions'], writes:['intent','facing'] },
      { id:'gravity', phase:'fixed', reads:['body'], writes:['body.velocity.y'] },
      { id:'locomotion', phase:'fixed', reads:['intent','controller','body'], writes:['body.velocity'] },
      { id:'voxel-collision', phase:'fixed', reads:['transform','body','voxels'], writes:['transform','body','grounded'] },
      { id:'interact', phase:'fixed', reads:['actions','voxels','inventory','facing'], writes:['voxels','inventory'] }
    ],
    recipes:[
      { id:'planks', input:{wood:2}, output:{plank:4} }
    ],
    rules:{ fixedHz:120, gravity:22, maxFall:17, reach:4.2 }
  })

  this.controls = /** @type {GameControls} */ ({ x:0, z:0 })
  this.actions = /** @type {GameActions} */ ({ jump:0, mine:0, place:0, craft:0 })
  this.running = true
  this.resetToken = 0
  this.telemetry = /** @type {Telemetry} */ ({
    position:{x:.5,y:4.9,z:.5}, speed:0, grounded:false, blocks:0, target:'none',
    inventory:{dirt:3,stone:0,wood:2,plank:0}, crafted:0, message:'loading world'
  })

  this.gameInput = event => this.controls = { x:event.detail.x, z:event.detail.z }
  this.gameAction = event => {
    const action = event.detail.action
    this.actions = { ...this.actions, [action]:this.actions[action] + 1 }
  }
  this.runChange = event => this.running = event.detail.running
  this.reset = () => this.resetToken++
  this.telemetryChange = event => this.telemetry = event.detail
</script>

<visualizer-shell>
  <header slot="mast" class="mast">
    <small>SKEIN / TYPED VOXEL WORLD / WEBGL2</small>
    <h1>VOXEL<br>MEADOW.</h1>
    <p>Walk on generated terrain, jump, mine real voxels, place blocks and craft planks. The world, controls, actions and system schedule are typed design-time contracts; the browser runs the fixed-step game loop directly.</p>
  </header>

  <visualizer-scene
    slot="scene"
    .world={world}
    .controls={controls}
    .actions={actions}
    .running={running}
    .resetToken={resetToken}
    @world-telemetry={telemetryChange}>
  </visualizer-scene>

  <visualizer-controls
    slot="controls"
    .running={running}
    @run-change={runChange}
    @world-reset={reset}>
  </visualizer-controls>

  <visualizer-gamepad
    slot="gamepad"
    @game-input-change={gameInput}
    @game-action={gameAction}>
  </visualizer-gamepad>

  <visualizer-inspector
    slot="inspector"
    .telemetry={telemetry}
    .world={world}>
  </visualizer-inspector>
</visualizer-shell>
