<script>
  /** @typedef {{ x:number, y:number, z:number }} Vec3 */
  /** @typedef {{ id:string, position:Vec3, size:Vec3, color:string, solid?:boolean }} Block */
  /** @typedef {{ id:string, name:string, position:Vec3, color:string }} NPC */
  /** @typedef {{ id:string, position:Vec3, patrol:{x:number,z:number}[], speed:number, chaseSpeed:number }} Enemy */
  /** @typedef {{ title:string, player:{spawn:Vec3,yaw:number}, npc:NPC, enemy:Enemy, walls:Block[], props:Block[], lockers:{id:string,x:number,z:number,yaw:number}[], fuse:{x:number,z:number}, panel:{x:number,z:number}, exit:{x:number,z:number} }} Game */
  /** @typedef {{ open:boolean, speaker:string, text:string, options:{id:string,label:string}[] }} Dialogue */
  /** @typedef {{ objective:string, prompt:string, stamina:number, danger:string, hidden:boolean, hasFuse:boolean, power:boolean, caught:boolean, ending:string, dialogue:Dialogue }} GameState */

  this.game = /** @type {Game} */ ({
    title:'THE NIGHT SHIFT',
    player:{ spawn:{x:0,y:1.65,z:7.6}, yaw:Math.PI },
    npc:{ id:'mira', name:'DR. MIRA VALE', position:{x:1.7,y:0,z:5.4}, color:'#a9bac4' },
    enemy:{
      id:'elias', position:{x:0,y:0,z:-14.5}, speed:1.45, chaseSpeed:3.45,
      patrol:[{x:0,z:-14.5},{x:0,z:-7},{x:-5.4,z:-7.2},{x:-7.2,z:-9.8},{x:-4.6,z:-6.2},{x:0,z:-1.5}]
    },
    fuse:{x:-6.6,z:-8.3},
    panel:{x:2.25,z:7.3},
    exit:{x:0,z:10.2},
    lockers:[
      {id:'hall-locker',x:2.45,z:-4.3,yaw:Math.PI},
      {id:'archive-locker',x:-8.2,z:-9.4,yaw:Math.PI/2}
    ],
    walls:[
      {id:'left-upper',position:{x:-3,y:1.5,z:3},size:{x:.28,y:3,z:14},color:'#283039',solid:true},
      {id:'left-lower',position:{x:-3,y:1.5,z:-14},size:{x:.28,y:3,z:8},color:'#242b32',solid:true},
      {id:'right-wall',position:{x:3,y:1.5,z:-4},size:{x:.28,y:3,z:28},color:'#222a31',solid:true},
      {id:'far-wall',position:{x:0,y:1.5,z:-18},size:{x:6.3,y:3,z:.28},color:'#20272e',solid:true},
      {id:'entry-left',position:{x:-2.05,y:1.5,z:10},size:{x:2.1,y:3,z:.28},color:'#252d34',solid:true},
      {id:'entry-right',position:{x:2.05,y:1.5,z:10},size:{x:2.1,y:3,z:.28},color:'#252d34',solid:true},
      {id:'archive-west',position:{x:-9,y:1.5,z:-7.5},size:{x:.28,y:3,z:9.3},color:'#1e252b',solid:true},
      {id:'archive-north',position:{x:-6,y:1.5,z:-12},size:{x:6.2,y:3,z:.28},color:'#1d242a',solid:true},
      {id:'archive-south',position:{x:-6,y:1.5,z:-3},size:{x:6.2,y:3,z:.28},color:'#252d34',solid:true}
    ],
    props:[
      {id:'desk',position:{x:1.65,y:.55,z:4.45},size:{x:2.2,y:1.1,z:.8},color:'#362d28',solid:true},
      {id:'glass',position:{x:1.65,y:1.35,z:5.05},size:{x:2.4,y:2.2,z:.08},color:'#5b7682'},
      {id:'panel',position:{x:2.72,y:1.25,z:7.3},size:{x:.16,y:.72,z:.48},color:'#62533f'},
      {id:'archive-shelf-a',position:{x:-7.5,y:1,z:-5.1},size:{x:2.2,y:2,z:.55},color:'#343238',solid:true},
      {id:'archive-shelf-b',position:{x:-5.1,y:1,z:-10.4},size:{x:2.5,y:2,z:.55},color:'#333137',solid:true},
      {id:'archive-table',position:{x:-5.8,y:.55,z:-7.2},size:{x:1.6,y:1.1,z:1.1},color:'#2e2c31',solid:true},
      {id:'hall-cart',position:{x:1.85,y:.45,z:-8.6},size:{x:1.1,y:.9,z:.7},color:'#34383a',solid:true}
    ]
  })

  this.state = /** @type {GameState} */ ({
    objective:'Find Dr. Mira at reception',
    prompt:'Click the scene to enter',
    stamina:1,
    danger:'quiet',
    hidden:false,
    hasFuse:false,
    power:false,
    caught:false,
    ending:'',
    dialogue:{open:false,speaker:'',text:'',options:[]}
  })

  this.gameState = event => this.state = event.detail
  this.dialogueChoice = event => host.shadowRoot.querySelector('visualizer-scene')?.dispatchEvent(new CustomEvent('dialogue-choice', { detail:event.detail }))
  this.gameCommand = event => host.shadowRoot.querySelector('visualizer-scene')?.dispatchEvent(new CustomEvent('game-command', { detail:event.detail }))
</script>

<visualizer-shell>
  <header slot="mast" class="mast">
    <small>SKEIN / PLAYABLE HORROR VERTICAL SLICE</small>
    <h1>THE NIGHT<br>SHIFT.</h1>
    <p>WASD move · mouse look · Shift sprint · C crouch · E interact. Elias sees movement, hears running and remembers where he lost you. Lockers break line of sight.</p>
  </header>

  <visualizer-scene
    slot="scene"
    .game={game}
    @game-state={gameState}>
  </visualizer-scene>

  <visualizer-hud
    slot="hud"
    .state={state}
    @game-command={gameCommand}>
  </visualizer-hud>

  <visualizer-dialogue
    slot="dialogue"
    .dialogue={state.dialogue}
    @dialogue-choice={dialogueChoice}>
  </visualizer-dialogue>
</visualizer-shell>
