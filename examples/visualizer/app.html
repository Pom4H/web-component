<script>
  /** @typedef {{ x:number, y:number, z:number }} Vec3 */
  /** @typedef {{ position:Vec3, target:Vec3, fov:number }} Camera */
  /** @typedef {{ direction:Vec3, color:string, intensity:number }} Light */
  /** @typedef {{ id:string, shape:'box'|'sphere'|'plane'|'torus', position:Vec3, rotation:Vec3, scale:Vec3, color:string, metallic?:number, roughness?:number }} Mesh */
  /** @typedef {{ name:string, camera:Camera, light:Light, objects:Mesh[] }} Scene */
  /** @typedef {{ fps:number, drawCalls:number, objects:number, selected:string }} Telemetry */

  this.scene = /** @type {Scene} */ ({
    name:'Mini Engine',
    camera:{ position:{x:7,y:5,z:9}, target:{x:0,y:1,z:0}, fov:48 },
    light:{ direction:{x:-.5,y:-1,z:-.35}, color:'#fff4d6', intensity:1.25 },
    objects:[
      { id:'ground', shape:'plane', position:{x:0,y:0,z:0}, rotation:{x:0,y:0,z:0}, scale:{x:12,y:1,z:12}, color:'#13161d', roughness:1 },
      { id:'hero', shape:'box', position:{x:0,y:1.25,z:0}, rotation:{x:.08,y:.55,z:0}, scale:{x:2.2,y:2.2,z:2.2}, color:'#ff6b35', metallic:.25, roughness:.35 },
      { id:'orb', shape:'sphere', position:{x:3.2,y:1.15,z:-1.8}, rotation:{x:0,y:0,z:0}, scale:{x:1.2,y:1.2,z:1.2}, color:'#7c5cff', metallic:.1, roughness:.2 },
      { id:'ring', shape:'torus', position:{x:-3.1,y:1.55,z:1.1}, rotation:{x:.85,y:.25,z:.2}, scale:{x:1.4,y:1.4,z:1.4}, color:'#56d6ff', metallic:.6, roughness:.18 }
    ]
  })

  this.running = true
  this.resetToken = 0
  this.telemetry = /** @type {Telemetry} */ ({ fps:0, drawCalls:0, objects:this.scene.objects.length, selected:'hero' })
  this.runChange = event => this.running = event.detail.running
  this.reset = () => this.resetToken++
  this.telemetryChange = event => this.telemetry = event.detail
</script>

<visualizer-shell>
  <header slot="mast" class="mast">
    <small>SKEIN / MINI 3D ENGINE / WEBGL2</small>
    <h1>SCENE<br>GRAPH.</h1>
    <p>The demo code reads like a tiny Unity scene: one camera, one light, a few meshes and an update loop. Skein only moves typed state between components; WebGL stays native and imperative.</p>
  </header>

  <visualizer-scene
    slot="scene"
    .scene={scene}
    .running={running}
    .resetToken={resetToken}
    @scene-telemetry={telemetryChange}>
  </visualizer-scene>

  <visualizer-controls
    slot="controls"
    .running={running}
    @run-change={runChange}
    @world-reset={reset}>
  </visualizer-controls>

  <visualizer-inspector
    slot="inspector"
    .telemetry={telemetry}
    .scene={scene}>
  </visualizer-inspector>
</visualizer-shell>
