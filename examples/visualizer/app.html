<script>
  /** @typedef {{ id:string, kind:'gravity'|'repulsor'|'vortex', position:[number,number,number], strength:number, radius:number, color:string }} Field */
  /** @typedef {{ fixedHz:number, arenaRadius:number, drag:number, restitution:number, maxSpeed:number, pickupRadius:number, thrust:number }} Rules */
  /** @typedef {{ score:number, speed:number, contacts:number, simTime:number, thrust:number, position:{x:number,y:number,z:number} }} Telemetry */

  this.fields = /** @type {Field[]} */ ([
    { id:'ASTER', kind:'gravity', position:[-2.8, .7, -.5], strength:14, radius:.72, color:'#68f7d2' },
    { id:'RIFT', kind:'vortex', position:[1.6, -.5, .2], strength:9.5, radius:.82, color:'#a779ff' },
    { id:'SUNDER', kind:'repulsor', position:[3.4, 1.2, -1.4], strength:11, radius:.68, color:'#ff8d63' }
  ])
  this.rules = /** @type {Rules} */ ({
    fixedHz:120,
    arenaRadius:6.4,
    drag:.16,
    restitution:.76,
    maxSpeed:8.5,
    pickupRadius:.5,
    thrust:7.5
  })
  this.running = true
  this.timeScale = 1
  this.fieldScale = 1
  this.resetToken = 0
  this.telemetry = /** @type {Telemetry} */ ({
    score:0, speed:0, contacts:0, simTime:0, thrust:0,
    position:{ x:0, y:0, z:0 }
  })

  this.runChange = event => this.running = event.detail.running
  this.timeScaleChange = event => this.timeScale = event.detail.value
  this.fieldScaleChange = event => this.fieldScale = event.detail.value
  this.reset = () => this.resetToken++
  this.telemetryChange = event => this.telemetry = event.detail
</script>

<visualizer-shell>
  <header slot="mast" class="mast">
    <small>SKEIN / DESIGN-TIME WORLD / WEBGL2</small>
    <h1>CURVATURE<br>ARENA.</h1>
    <p>
      A tiny game world driven by real mathematics: fixed-step integration, softened inverse-square fields,
      a curl force, damping and spherical collision response. Skein owns the declarative world contract;
      WebGL owns continuous simulation and pixels.
    </p>
  </header>

  <visualizer-scene
    slot="scene"
    .fields={fields}
    .rules={rules}
    .running={running}
    .timeScale={timeScale}
    .fieldScale={fieldScale}
    .resetToken={resetToken}
    @world-telemetry={telemetryChange}>
  </visualizer-scene>

  <visualizer-controls
    slot="controls"
    .running={running}
    .timeScale={timeScale}
    .fieldScale={fieldScale}
    @run-change={runChange}
    @time-scale-change={timeScaleChange}
    @field-scale-change={fieldScaleChange}
    @world-reset={reset}>
  </visualizer-controls>

  <visualizer-inspector
    slot="inspector"
    .telemetry={telemetry}
    .rules={rules}
    .fields={fields}>
  </visualizer-inspector>
</visualizer-shell>

<style>
  :host { display:block; min-height:100vh; background:#020409; color:#edf5ff; font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
  * { box-sizing:border-box; }
  .mast { min-width:0; }
  small { display:block; color:#68f7d2; font:800 9px/1.2 ui-monospace,SFMono-Regular,monospace; letter-spacing:.18em; }
  h1 { margin:9px 0 0; max-width:12ch; font:900 clamp(38px,5vw,74px)/.82 Arial Black,Impact,sans-serif; letter-spacing:-.075em; }
  p { max-width:610px; margin:14px 0 0; color:#7f8da1; font-size:12px; line-height:1.58; }
  visualizer-scene, visualizer-controls, visualizer-inspector { display:block; min-width:0; }
  @media(max-width:700px){h1{font-size:clamp(36px,11vw,58px)}p{display:none}}
</style>
