<script>
  input('running', /** @type {boolean} */ (true))
  this.action = computed(() => this.running ? 'pause' : 'resume')
  this.toggle = () => host.dispatchEvent(new CustomEvent('run-change', {
    detail:{running:!this.running}, bubbles:true, composed:true
  }))
  this.reset = () => host.dispatchEvent(new CustomEvent('world-reset', { bubbles:true, composed:true }))
</script>

<section part="controls">
  <button data-action="run" @click={toggle}>{action}</button>
  <button data-action="reset" class="reset" @click={reset}>new world</button>
</section>

<style>
  :host { display:block; }
  section { display:flex; gap:10px; }
  button { min-height:46px; padding:0 16px; border:2px solid #526b49; border-radius:12px; background:#f7fff0e8; color:#25402b; box-shadow:0 4px 0 #526b49; font:900 9px/1 ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; }
  button:active { translate:0 3px; box-shadow:0 1px 0 #526b49; }
  .reset { background:#fff0a8ed; border-color:#8b7335; box-shadow:0 4px 0 #8b7335; }
</style>
