<script>
  input('running', true)
  input('speed', 1)

  this.toggle = () => host.dispatchEvent(new CustomEvent('run-change', {
    detail:{ running:!this.running }, bubbles:true, composed:true
  }))
  this.changeSpeed = event => host.dispatchEvent(new CustomEvent('speed-change', {
    detail:{ speed:Number(event.currentTarget.value) }, bubbles:true, composed:true
  }))
</script>

<section>
  <header><small>CONTROL SURFACE</small><b>{running}</b></header>
  <button @click={toggle}>{running}</button>
  <label>
    <span>pipeline speed</span>
    <output>{speed}</output>
    <input type="range" min="0.25" max="2.5" step="0.25" .value={speed} @input={changeSpeed}>
  </label>
  <p>Drag the scene to orbit. Scroll to zoom. Click a floating stage label to jump through the same event → state → property path.</p>
</section>

  :host { display:block; color:#dbe6f7; }
  * { box-sizing:border-box; }

  button:hover { border-color:#65b7ff; }
  label { display:grid; grid-template-columns:1fr auto; gap:8px 12px; margin-top:14px; color:#93a1b5; font:700 10px ui-monospace,monospace; }
