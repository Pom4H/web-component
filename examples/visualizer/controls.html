<script>
  input('running', /** @type {boolean} */ (true))
  this.action = computed(() => this.running ? 'pause' : 'resume')
  this.toggle = () => host.dispatchEvent(new CustomEvent('run-change', {
    detail:{running:!this.running}, bubbles:true, composed:true
  }))
  this.reset = () => host.dispatchEvent(new CustomEvent('world-reset', { bubbles:true, composed:true }))
</script>

<section part="controls">
  <button data-action="run" @click={toggle}>{action}</button>
  <button data-action="reset" class="reset" @click={reset}>reset scene</button>
</section>

<style>
  :host { display:block; }
  section { display:flex; gap:10px; }
  button { min-height:44px; padding:0 16px; border:1px solid #383f50; border-radius:12px; background:#101620e8; color:#e6ebf7; box-shadow:0 10px 30px #0007; font:900 9px/1 ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; backdrop-filter:blur(12px); }
  button:active { translate:0 2px; }
  .reset { color:#ff9d77; border-color:#5a4037; }
</style>
