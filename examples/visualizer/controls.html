<script>
  input('running', true)
  input('speed', 1)
  this.action = computed(() => this.running ? 'pause flow' : 'resume flow')
  this.mode = computed(() => this.running ? 'running' : 'paused')

  this.toggle = () => host.dispatchEvent(new CustomEvent('run-change', {
    detail:{ running:!this.running }, bubbles:true, composed:true
  }))
  this.changeSpeed = event => host.dispatchEvent(new CustomEvent('speed-change', {
    detail:{ speed:Number(event.currentTarget.value) }, bubbles:true, composed:true
  }))
  this.write = () => host.dispatchEvent(new CustomEvent('write', {
    bubbles:true, composed:true
  }))
</script>

<section>
  <header><small>CONTROL SURFACE</small><b>{mode}</b></header>
  <div class="actions">
    <button data-action="write" class="write" @click={write}>this.count++</button>
    <button data-action="run" @click={toggle}>{action}</button>
  </div>
  <label>
    <span>pipeline speed</span>
    <output>{speed}×</output>
    <input type="range" min="0.25" max="2.5" step="0.25" .value={speed} @input={changeSpeed}>
  </label>
  <p>Move the pointer through the field to bend the fibers. Click a property node or trigger a write and watch only its dependency closure wake up.</p>
</section>

  small { color:#72839b; font:700 9px ui-monospace,monospace; letter-spacing:.14em; }

  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { width:100%; border:1px solid #2a4160; border-radius:12px; padding:11px 12px; color:#f4f8ff; background:#101c2c; font:800 10px ui-monospace,monospace; text-transform:uppercase; cursor:pointer; }
  button:hover { border-color:#65b7ff; }
  .write { color:#06100c; border-color:#78f7d0; background:#78f7d0; box-shadow:0 0 28px #78f7d026; }
  .write:hover { border-color:#d8fff2; background:#a0ffe1; }

</style>
