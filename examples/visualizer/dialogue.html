<script>
  input('dialogue', {open:false,speaker:'',text:'',options:[]})
  this.choose = event => host.dispatchEvent(new CustomEvent('dialogue-choice', {
    detail:{id:event.currentTarget.dataset.id}, bubbles:true, composed:true
  }))
</script>

<section if={dialogue.open} class="dialogue" aria-live="polite">
  <small>{dialogue.speaker}</small>
  <p>{dialogue.text}</p>
  <div class="choices">
    <button each={dialogue.options} key={id} data-id={id} @click={choose}>{label}</button>
  </div>
</section>

<style>
  :host{position:absolute;inset:0;display:block;pointer-events:none;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
  *{box-sizing:border-box}
  .dialogue{position:absolute;left:50%;bottom:7vh;translate:-50% 0;width:min(680px,calc(100vw - 32px));padding:18px 20px;border:1px solid #403d38;border-radius:6px;background:#0a0b0bdd;color:#e7e0d6;box-shadow:0 20px 60px #000b;backdrop-filter:blur(12px);pointer-events:auto}
  small{display:block;margin-bottom:8px;color:#a64b43;font:900 9px/1 ui-monospace,monospace;letter-spacing:.18em}
  p{margin:0;color:#ddd7cd;font:500 15px/1.55 ui-monospace,SFMono-Regular,monospace}
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  button{min-height:38px;padding:0 12px;border:1px solid #45413b;border-radius:4px;background:#171716;color:#c9c3ba;font:800 9px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  button:hover{border-color:#8d4a43;color:#fff;background:#241614}
  @media(max-width:700px){.dialogue{bottom:20px}p{font-size:13px}.choices{display:grid}.choices button{width:100%}}
</style>
