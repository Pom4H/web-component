<script>
  const held = new Map()
  let current = { x:0, z:0 }

  const emitInput = () => {
    let x=0,z=0
    for(const value of held.values()) { x+=value.x; z+=value.z }
    const length=Math.hypot(x,z)
    if(length>1){x/=length;z/=length}
    if(current.x===x && current.z===z) return
    current={x,z}
    host.dispatchEvent(new CustomEvent('game-input-change', {
      detail:current, bubbles:true, composed:true
    }))
  }

  this.pressMove = event => {
    if(event.pointerType==='mouse' && event.button!==0) return
    const x=Number(event.currentTarget.dataset.x)||0
    const z=Number(event.currentTarget.dataset.z)||0
    held.set(event.pointerId,{x,z})
    try { event.currentTarget.setPointerCapture?.(event.pointerId) } catch {}
    emitInput()
    event.preventDefault()
  }
  this.releaseMove = event => {
    held.delete(event.pointerId)
    emitInput()
    event.preventDefault()
  }
  this.action = event => {
    const action=event.currentTarget.dataset.action
    host.dispatchEvent(new CustomEvent('game-action', {
      detail:{action}, bubbles:true, composed:true
    }))
    try { navigator.vibrate?.(8) } catch {}
  }
  this.blockMenu = event => event.preventDefault()

  onCleanup(()=>{
    held.clear()
    current={x:0,z:0}
    host.dispatchEvent(new CustomEvent('game-input-change', {
      detail:current, bubbles:true, composed:true
    }))
  })
</script>

<nav part="gamepad" aria-label="Voxel game controls" @contextmenu={blockMenu}>
  <div class="dpad" aria-label="Move">
    <button class="move up" data-x="0" data-z="-1" aria-label="Move forward" @pointerdown={pressMove} @pointerup={releaseMove} @pointercancel={releaseMove}>↑</button>
    <button class="move left" data-x="-1" data-z="0" aria-label="Move left" @pointerdown={pressMove} @pointerup={releaseMove} @pointercancel={releaseMove}>←</button>
    <span class="center"></span>
    <button class="move right" data-x="1" data-z="0" aria-label="Move right" @pointerdown={pressMove} @pointerup={releaseMove} @pointercancel={releaseMove}>→</button>
    <button class="move down" data-x="0" data-z="1" aria-label="Move backward" @pointerdown={pressMove} @pointerup={releaseMove} @pointercancel={releaseMove}>↓</button>
  </div>

  <div class="actions" aria-label="Actions">
    <button class="jump" data-action="jump" @click={action}><b>↑</b><small>JUMP</small></button>
    <button data-action="mine" @click={action}><b>−</b><small>BREAK</small></button>
    <button data-action="place" @click={action}><b>+</b><small>PLACE</small></button>
    <button class="craft" data-action="craft" @click={action}><b>▦</b><small>CRAFT</small></button>
  </div>
</nav>
