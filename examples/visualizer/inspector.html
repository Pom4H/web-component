<script>
  input('telemetry', {fps:0,drawCalls:0,objects:0,selected:'hero'})
  input('scene', {name:'Scene',camera:{position:{x:0,y:0,z:0},target:{x:0,y:0,z:0},fov:45},light:{direction:{x:0,y:-1,z:0},color:'#fff',intensity:1},objects:[]})
  this.camera = computed(()=>`${this.scene.camera.position.x} / ${this.scene.camera.position.y} / ${this.scene.camera.position.z}`)
</script>

<section part="panel">
  <header><small>{scene.name}</small><b>{telemetry.fps}</b></header>
  <div class="state"><strong>{telemetry.objects}</strong><span>objects</span><strong>{telemetry.drawCalls}</strong><span>draw calls</span></div>
  <div class="objects"><span each={scene.objects}>{id}</span></div>
  <dl>
    <div><dt>camera</dt><dd>{camera}</dd></div>
    <div><dt>fov</dt><dd>{scene.camera.fov}°</dd></div>
    <div><dt>light</dt><dd>{scene.light.intensity}</dd></div>
    <div><dt>selected</dt><dd>{telemetry.selected}</dd></div>
    <div><dt>renderer</dt><dd>WebGL2</dd></div>
  </dl>
</section>
