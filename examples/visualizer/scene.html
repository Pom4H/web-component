<script>
  input('steps', [])
  input('selected', 0)
  input('running', true)
  input('speed', 1)
  input('burst', 0)

  this.status = 'booting'
  this.fps = 0
  this.count = 41
  this.flash = false
  this.properties = [
    { id:'count', label:'count', color:'#78f7d0' },
    { id:'user', label:'user.name', color:'#5b8cff' },
    { id:'items', label:'items.length', color:'#c27bff' },
    { id:'theme', label:'theme.accent', color:'#ff9d58' }
  ]
  this.source = 0
  this.viewSteps = computed(() => this.steps.map((step, index) => ({ ...step, index, selected:index === this.selected })))
  this.viewProperties = computed(() => this.properties.map((property, index) => ({ ...property, index, selected:index === this.source })))

  let phase = 0
  let frame = 0
  let observer
  let flashTimer
  let lastBurst = this.burst
  let pointer = [0, 0]
  let pointerTarget = [0, 0]
  let pointerHeat = 0
  const trail = []

  const emit = (name, detail) => host.dispatchEvent(new CustomEvent(name, { detail, bubbles:true, composed:true }))
  this.pickStage = event => {
    phase = Number(event.currentTarget.dataset.index) || 0
    emit('step-select', { index:Math.floor(phase) })
  }
  this.pickProperty = event => {
    this.source = Number(event.currentTarget.dataset.index) || 0
    phase = 5.04
    pointerHeat = 1
    emit('step-select', { index:5 })
    emit('energy-change', { energy:.98 })
  }
  this.pointerMove = event => {
    const box = event.currentTarget.getBoundingClientRect()
    pointerTarget[0] = (event.clientX - box.left) / Math.max(1, box.width) * 2 - 1
    pointerTarget[1] = 1 - (event.clientY - box.top) / Math.max(1, box.height) * 2
    pointerHeat = Math.min(1.4, pointerHeat + .24)
    trail.push({ x:pointerTarget[0], y:pointerTarget[1], life:1 })
    if (trail.length > 14) trail.shift()
  }
  this.pointerLeave = () => { pointerTarget = [0, 0]; pointerHeat = Math.max(pointerHeat, .3) }

  queueMicrotask(() => {
    const canvas = host.shadowRoot.querySelector('canvas')
    const gl = canvas.getContext('webgl2', { antialias:true, alpha:false, powerPreference:'high-performance' })
    if (!gl) { this.status = 'WebGL2 unavailable'; return }

    const compile = (type, source) => {
      const shader = gl.createShader(type)
      gl.shaderSource(shader, source)
      gl.compileShader(shader)
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || 'shader compile failed')
      return shader
    }
    const link = (vertex, fragment) => {
      const program = gl.createProgram()
      gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex))
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment))
      gl.linkProgram(program)
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || 'program link failed')
      return program
    }

    let backgroundProgram, lineProgram, pointProgram
    try {
      backgroundProgram = link(`#version 300 es
        precision highp float;
        void main(){
          vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
          gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
        }
      `, `#version 300 es
        precision highp float;
        uniform vec2 uResolution;
        uniform vec2 uPointer;
        uniform float uTime;
        uniform float uEnergy;
        uniform float uStage;
        out vec4 outColor;
        float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
        float noise(vec2 p){
          vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
        }
        void main(){
          vec2 uv = gl_FragCoord.xy / max(uResolution,vec2(1.0));
          vec2 p = uv * 2.0 - 1.0; p.x *= uResolution.x / max(1.0,uResolution.y);
          vec2 m = vec2(uPointer.x * uResolution.x/uResolution.y, uPointer.y);
          float d = length(p-m);
          float n = noise(p*2.8 + vec2(uTime*.035,-uTime*.028));
          float bands = .5 + .5*sin(p.x*5.0 + p.y*3.0 + n*3.0 - uTime*.28);
          float wake = exp(-d*d*2.7) * (.16 + uEnergy*.28);
          float ring = exp(-abs(d - fract(uTime*.22)*1.7)*17.0) * uEnergy * .10;
          float stageGlow = .03 + .025*sin(uStage*.9 + p.x*2.0 - p.y*1.5);
          vec3 color = vec3(.008,.014,.026);
          color += vec3(.02,.08,.13) * (bands*.16 + n*.10 + stageGlow);
          color += vec3(.08,.42,.55) * wake;
          color += vec3(.26,.20,.58) * ring;
          float vignette = smoothstep(1.35,.22,length(p*.72));
          color *= .58 + .42*vignette;
          outColor = vec4(color,1.0);
        }
      `)
      lineProgram = link(`#version 300 es
        precision highp float;
        layout(location=0) in vec3 aPosition;
        layout(location=1) in vec4 aColor;
        out vec4 vColor;
        void main(){ gl_Position=vec4(aPosition,1.0); vColor=aColor; }
      `, `#version 300 es
        precision highp float;
        in vec4 vColor;
        out vec4 outColor;
        void main(){ outColor=vColor; }
      `)
      pointProgram = link(`#version 300 es
        precision highp float;
        layout(location=0) in vec3 aPosition;
        layout(location=1) in vec4 aColor;
        layout(location=2) in float aSize;
        out vec4 vColor;
        void main(){ gl_Position=vec4(aPosition,1.0); gl_PointSize=aSize; vColor=aColor; }
      `, `#version 300 es
        precision highp float;
        in vec4 vColor;
        out vec4 outColor;
        void main(){
          vec2 p=gl_PointCoord*2.0-1.0;
          float d=dot(p,p);
          if(d>1.0) discard;
          float core=smoothstep(1.0,.02,d);
          float glow=smoothstep(1.0,.22,d);
          outColor=vec4(vColor.rgb*(.75+core*.8),vColor.a*glow);
        }
      `)
    } catch (error) {
      this.status = 'shader error'
      console.error(error)
      return
    }

    const bgVao = gl.createVertexArray()
    const lineVao = gl.createVertexArray()
    const lineBuffer = gl.createBuffer()
    gl.bindVertexArray(lineVao)
    gl.bindBuffer(gl.ARRAY_BUFFER, lineBuffer)
    gl.enableVertexAttribArray(0)
    gl.enableVertexAttribArray(1)
    gl.vertexAttribPointer(0,3,gl.FLOAT,false,28,0)
    gl.vertexAttribPointer(1,4,gl.FLOAT,false,28,12)

    const pointVao = gl.createVertexArray()
    const pointBuffer = gl.createBuffer()
    gl.bindVertexArray(pointVao)
    gl.bindBuffer(gl.ARRAY_BUFFER, pointBuffer)
    gl.enableVertexAttribArray(0)
    gl.enableVertexAttribArray(1)
    gl.enableVertexAttribArray(2)
    gl.vertexAttribPointer(0,3,gl.FLOAT,false,32,0)
    gl.vertexAttribPointer(1,4,gl.FLOAT,false,32,12)
    gl.vertexAttribPointer(2,1,gl.FLOAT,false,32,28)

    const sources = [[-4.45,1.42,.2],[-4.28,.46,-.15],[-4.36,-.53,.12],[-4.18,-1.46,-.08]]
    const targets = [[3.7,1.55,-.3],[4.1,.98,.2],[3.82,.38,-.1],[4.18,-.24,.3],[3.75,-.82,-.18],[4.05,-1.4,.14]]
    const connections = [
      [0,0],[0,2],[0,3],[0,5],
      [1,1],[1,3],[1,4],
      [2,0],[2,2],[2,4],[2,5],
      [3,1],[3,3],[3,5]
    ]
    const propertyColors = ['#78f7d0','#5b8cff','#c27bff','#ff9d58']
    const effectColor = '#77cfff'

    const hex = value => {
      const text=String(value||'#78f7d0').replace('#','')
      const full=text.length===3?text.split('').map(c=>c+c).join(''):text
      const n=Number.parseInt(full,16)
      return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255]
    }
    const mix = (a,b,t) => a.map((v,i)=>v+(b[i]-v)*t)
    const bezier = (a,b,c,t) => {
      const u=1-t
      return [u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1],u*u*a[2]+2*u*t*b[2]+t*t*c[2]]
    }
    const project = point => {
      const parallaxX = pointer[0]*.10
      const parallaxY = pointer[1]*.08
      const yaw = -.11 + parallaxX
      const pitch = .10 - parallaxY
      const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch)
      const rx=cy*point[0]-sy*point[2]
      const rz=sy*point[0]+cy*point[2]
      const ry=cp*point[1]-sp*rz
      const depth=sp*point[1]+cp*rz+9.6
      const aspect=canvas.width/Math.max(1,canvas.height)
      const focal=1/Math.tan(.72/2)
      return [rx*focal/(aspect*depth),ry*focal/depth,Math.max(-.94,Math.min(.94,((depth-2)/16)*2-1)),depth]
    }
    const disturb = (point, now) => {
      let x=point[0], y=point[1], z=point[2]
      const px=pointer[0]*4.5, py=pointer[1]*2.55
      const d2=(x-px)*(x-px)+(y-py)*(y-py)
      const force=Math.exp(-d2*.72)*pointerHeat
      z += Math.sin(now*.004 + x*1.7 + y*1.3)*(.04+force*.34)
      y += Math.cos(now*.003 + x*1.1)*force*.12
      for(const mark of trail){
        const mx=mark.x*4.5,my=mark.y*2.55
        const md2=(x-mx)*(x-mx)+(y-my)*(y-my)
        z += Math.exp(-md2*1.05)*mark.life*.13
      }
      return [x,y,z]
    }
    const lineVertex = (list,p,color,alpha) => {
      const q=project(p)
      const depthFade=Math.max(.35,Math.min(1,1.25-(q[3]-7)*.09))
      list.push(q[0],q[1],q[2],color[0],color[1],color[2],alpha*depthFade)
    }
    const pointVertex = (list,p,color,alpha,size) => {
      const q=project(p)
      list.push(q[0],q[1],q[2],color[0],color[1],color[2],alpha,size)
    }
    const segment = (list,a,b,color,alpha) => { lineVertex(list,a,color,alpha); lineVertex(list,b,color,alpha) }
    const drawLines = data => {
      if(!data.length)return
      gl.useProgram(lineProgram)
      gl.bindVertexArray(lineVao)
      gl.bindBuffer(gl.ARRAY_BUFFER,lineBuffer)
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW)
      gl.drawArrays(gl.LINES,0,data.length/7)
    }
    const drawPoints = data => {
      if(!data.length)return
      gl.useProgram(pointProgram)
      gl.bindVertexArray(pointVao)
      gl.bindBuffer(gl.ARRAY_BUFFER,pointBuffer)
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW)
      gl.drawArrays(gl.POINTS,0,data.length/8)
    }
    const resize = () => {
      const ratio=Math.min(2,window.devicePixelRatio||1)
      const width=Math.max(1,Math.round(canvas.clientWidth*ratio))
      const height=Math.max(1,Math.round(canvas.clientHeight*ratio))
      if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height}
      gl.viewport(0,0,width,height)
    }
    observer=new ResizeObserver(resize)
    observer.observe(canvas)
    resize()
    this.status='WebGL2 live'

    let previous=performance.now()
    let fpsStart=previous
    let frames=0
    let previousStage=-1
    let pendingCount=this.count
    let commitAt=-1
    const render = now => {
      const dt=Math.min(.05,(now-previous)/1000)
      previous=now
      pointer[0]+=(pointerTarget[0]-pointer[0])*.055
      pointer[1]+=(pointerTarget[1]-pointer[1])*.055
      pointerHeat*=Math.pow(.18,dt)
      for(let i=trail.length-1;i>=0;i--){trail[i].life-=dt*.72;if(trail[i].life<=0)trail.splice(i,1)}

      if(this.burst!==lastBurst){
        lastBurst=this.burst
        phase=5.03
        pointerHeat=1.25
        pendingCount=this.count+1
      } else if(this.running) {
        phase += dt * .72 * Math.max(.1,Number(this.speed)||1)
      }

      const stage=((Math.floor(phase)%8)+8)%8
      const local=phase-Math.floor(phase)
      if(stage!==previousStage){
        previousStage=stage
        emit('step-select',{index:stage})
        emit('energy-change',{energy:.48+stage*.055})
        if(stage===5) pendingCount=this.count+1
        if(stage===7 && commitAt!==Math.floor(phase)){
          commitAt=Math.floor(phase)
          this.count=pendingCount
          this.flash=true
          clearTimeout(flashTimer)
          flashTimer=setTimeout(()=>this.flash=false,260)
        }
      }

      resize()
      gl.disable(gl.DEPTH_TEST)
      gl.disable(gl.BLEND)
      gl.useProgram(backgroundProgram)
      gl.bindVertexArray(bgVao)
      gl.uniform2f(gl.getUniformLocation(backgroundProgram,'uResolution'),canvas.width,canvas.height)
      gl.uniform2f(gl.getUniformLocation(backgroundProgram,'uPointer'),pointer[0],pointer[1])
      gl.uniform1f(gl.getUniformLocation(backgroundProgram,'uTime'),now/1000)
      gl.uniform1f(gl.getUniformLocation(backgroundProgram,'uEnergy'),Math.min(1.2,.38+pointerHeat*.35+(stage>=5?.32:.06)))
      gl.uniform1f(gl.getUniformLocation(backgroundProgram,'uStage'),stage)
      gl.drawArrays(gl.TRIANGLES,0,3)

      gl.enable(gl.BLEND)
      gl.blendFunc(gl.SRC_ALPHA,gl.ONE)
      const lines=[]
      const points=[]
      const activeSource=Number(this.source)||0
      const activeColor=hex(propertyColors[activeSource])
      const cold=[.17,.30,.44]

      for(let gi=-5;gi<=5;gi++){
        const yy=gi*.43
        segment(lines,[-5.5,yy,-.65],[5.5,yy,.65],cold,.025)
      }

      connections.forEach(pair=>{
        const sourceIndex=pair[0], targetIndex=pair[1]
        const a=sources[sourceIndex], c=targets[targetIndex]
        const seed=(sourceIndex*17+targetIndex*29)*.13
        const control=[-.25+Math.sin(seed)*.65,(a[1]+c[1])*.48+Math.sin(seed*1.7)*.55,Math.cos(seed)*1.15]
        const isActive=sourceIndex===activeSource
        let visibility=.055
        if(stage===1) visibility=.06+.20*Math.min(1,local*1.8)
        if(stage===2) visibility=.10
        if(stage===3) visibility=isActive?.18:.035
        if(stage===4) visibility=isActive?.72:.025
        if(stage===5) visibility=isActive?.90:.018
        if(stage===6) visibility=isActive?.55:.022
        if(stage===7) visibility=isActive?.96:.018
        const color=isActive?mix(activeColor,[1,1,1],stage===7?.24:.04):cold
        let previousPoint=null
        const segments=28
        for(let s=0;s<=segments;s++){
          const t=s/segments
          let p=bezier(a,control,c,t)
          const drift=Math.sin(now*.0018+t*11+seed)*.065
          p=[p[0],p[1]+drift*(1-t)*t*4,p[2]+Math.cos(now*.0015+t*8+seed)*.08]
          p=disturb(p,now)
          const reveal=stage===1?Math.min(1,local*1.55):1
          if(t<=reveal && previousPoint) segment(lines,previousPoint,p,color,visibility*(.55+.45*Math.sin(t*Math.PI)))
          previousPoint=p
        }
        if(isActive && stage>=3){
          const pulseCount=stage===6?2:4
          for(let pIndex=0;pIndex<pulseCount;pIndex++){
            let t=(local+pIndex/pulseCount)%1
            if(stage===5) t=Math.min(1,local*.72+pIndex*.055)
            if(stage===7) t=Math.min(1,.52+local*.48+pIndex*.07)
            const p=disturb(bezier(a,control,c,t),now)
            pointVertex(points,p,mix(activeColor,[1,1,1],.35),.75,5.5+(1-t)*3.5)
          }
        }
      })

      sources.forEach((position,index)=>{
        const active=index===activeSource
        const color=hex(propertyColors[index])
        pointVertex(points,disturb(position,now),color,active?.98:.30,active?18:10)
        if(active && stage===5){
          for(let ring=0;ring<18;ring++){
            const angle=ring/18*Math.PI*2
            const radius=.22+local*1.2
            const p=[position[0]+Math.cos(angle)*radius,position[1]+Math.sin(angle)*radius,position[2]]
            pointVertex(points,p,color,(1-local)*.35,3.2)
          }
        }
      })
      targets.forEach((position,index)=>{
        const connected=connections.some(pair=>pair[0]===activeSource&&pair[1]===index)
        const color=connected?mix(activeColor,hex(effectColor),.45):hex(effectColor)
        const arrival=stage===7?Math.max(0,1-Math.abs(local-.62)*4):0
        pointVertex(points,position,color,connected?.60:.18,connected?11+arrival*9:7)
      })

      if(stage===6){
        const center=[0,0,.35]
        const radius=1.55*(1-local)+.12
        for(let i=0;i<42;i++){
          const angle=i/42*Math.PI*2
          const p=[center[0]+Math.cos(angle)*radius*1.5,center[1]+Math.sin(angle)*radius*.68,center[2]+Math.sin(angle*3+now*.004)*.12]
          pointVertex(points,p,mix(activeColor,[.8,.55,1],.35),.18+.30*(1-local),3.5)
        }
      }

      drawLines(lines)
      drawPoints(points)

      frames++
      if(now-fpsStart>750){this.fps=Math.round(frames*1000/(now-fpsStart));frames=0;fpsStart=now}
      frame=requestAnimationFrame(render)
    }
    frame=requestAnimationFrame(render)
  })

  onCleanup(() => {
    cancelAnimationFrame(frame)
    observer?.disconnect()
    clearTimeout(flashTimer)
  })
</script>

<section class="stage">
  <canvas aria-label="Interactive WebGL dependency field for the Skein reactive pipeline" @pointermove={pointerMove} @pointerleave={pointerLeave}></canvas>

  <div class="properties" aria-label="Reactive properties">
    <button each={viewProperties} key={id} data-index={index} data-selected={selected} --accent={color} @click={pickProperty}>
      <i></i><span>{label}</span>
    </button>
  </div>

  <div class="targets" aria-label="Exact DOM targets">
    <small>REAL DOM</small>
    <output ?data-flash={flash}><span>textContent</span><b>{count}</b></output>
    <span>--accent</span>
    <span>cx</span>
    <span>user effect</span>
  </div>

  <nav class="labels" aria-label="Runtime stages">
    <button each={viewSteps} key={id} data-index={index} data-selected={selected} --accent={color} @click={pickStage}>
      <b>0{id}</b><span>{title}</span>
    </button>
  </nav>

  <div class="hud top"><span>{status}</span><b>{fps} FPS</b></div>
  <div class="hud bottom"><span>pointer bends field</span><span>click property = write</span><span>DOM commits are real</span></div>
  <div class="energy"></div>
</section>

<style>
  :host { display:block; height:100%; min-height:590px; --energy:.65; }
  * { box-sizing:border-box; }
  .stage { position:relative; width:100%; height:100%; min-height:590px; overflow:hidden; border:1px solid #17283a; border-radius:22px; background:#03060b; box-shadow:inset 0 1px #24405b88,0 30px 100px #0009; }
  canvas { display:block; width:100%; height:100%; min-height:590px; touch-action:none; cursor:crosshair; }
  .energy { position:absolute; inset:-20%; pointer-events:none; background:radial-gradient(circle at 52% 48%,rgba(87,192,255,calc(var(--energy)*.08)),transparent 46%); mix-blend-mode:screen; }

  .properties { position:absolute; z-index:30; left:14px; top:50%; translate:0 -50%; display:grid; gap:8px; pointer-events:none; }
  .properties button { --accent:#78f7d0; pointer-events:auto; display:flex; align-items:center; gap:9px; width:max-content; max-width:150px; padding:8px 10px; border:1px solid #1c2c40; border-radius:999px; color:#708198; background:#050b13d9; font:700 9px ui-monospace,monospace; cursor:pointer; backdrop-filter:blur(10px); transition:.18s ease; }
  .properties i { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 16px var(--accent); }
  .properties button:hover,.properties button[data-selected="true"] { color:#f5fbff; border-color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,#050b13); transform:translateX(4px); }

  .targets { position:absolute; z-index:30; right:14px; top:50%; translate:0 -50%; width:132px; display:grid; gap:7px; pointer-events:none; }
  .targets small { color:#5e6f84; font:800 8px ui-monospace,monospace; letter-spacing:.16em; }
  .targets > span,.targets output { display:flex; justify-content:space-between; gap:12px; align-items:center; min-height:34px; padding:8px 10px; border:1px solid #1a2b3d; border-radius:9px; color:#7e8da0; background:#050b13d9; backdrop-filter:blur(10px); font:700 8px ui-monospace,monospace; }
  .targets output { color:#9fb0c5; border-color:#265b64; }
  .targets output span { color:#7195a4; }
  .targets output b { color:#78f7d0; font-size:17px; text-shadow:0 0 18px #78f7d066; }
  .targets output[data-flash] { animation:commit .28s ease-out; }
  @keyframes commit { 0%{transform:scale(.94);box-shadow:0 0 0 #78f7d000;background:#78f7d008} 35%{transform:scale(1.055);box-shadow:0 0 36px #78f7d05c;background:#78f7d020} 100%{transform:scale(1);box-shadow:0 0 0 #78f7d000} }

  .labels { position:absolute; z-index:40; left:50%; bottom:42px; translate:-50% 0; width:min(92%,920px); display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:5px; pointer-events:none; }
  .labels button { --accent:#78f7d0; pointer-events:auto; min-width:0; padding:7px 6px; border:1px solid #172637; border-radius:9px; color:#5c6c80; background:#050a11d9; backdrop-filter:blur(12px); font:700 7px ui-monospace,monospace; text-align:left; cursor:pointer; transition:.16s ease; overflow:hidden; }
  .labels b { display:block; margin-bottom:3px; color:var(--accent); font-size:7px; }
  .labels span { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .labels button:hover,.labels button[data-selected="true"] { color:#eef7ff; border-color:color-mix(in srgb,var(--accent) 72%,#223); background:color-mix(in srgb,var(--accent) 9%,#050a11); box-shadow:0 0 20px color-mix(in srgb,var(--accent) 13%,transparent); }

  .hud { position:absolute; z-index:50; display:flex; gap:7px; align-items:center; color:#617287; font:700 8px ui-monospace,monospace; letter-spacing:.09em; text-transform:uppercase; pointer-events:none; }
  .hud span,.hud b { padding:6px 8px; border:1px solid #172638; border-radius:999px; background:#050a11cc; }
  .hud b { color:#78f7d0; }
  .top { top:13px; right:13px; }
  .bottom { left:50%; bottom:10px; translate:-50% 0; white-space:nowrap; }

  @media(max-width:760px){
