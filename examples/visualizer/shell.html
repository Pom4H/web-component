<script>
  const activePointers = new Map()

  const keyDown = code => window.dispatchEvent(new KeyboardEvent('keydown', {
    code, bubbles:true
  }))
  const keyUp = code => window.dispatchEvent(new KeyboardEvent('keyup', {
    code, bubbles:true
  }))

  this.mobilePress = event => {
    if (event.pointerType === 'mouse' && event.button !== 0) return
    const code = event.currentTarget.dataset.key
    if (!code) return
    const previous = activePointers.get(event.pointerId)
    if (previous && previous !== code) keyUp(previous)
    activePointers.set(event.pointerId, code)
    try { event.currentTarget.setPointerCapture?.(event.pointerId) } catch {}
    keyDown(code)
    event.preventDefault()
  }

  this.mobileRelease = event => {
    const code = activePointers.get(event.pointerId) || event.currentTarget.dataset.key
    if (code) keyUp(code)
    activePointers.delete(event.pointerId)
    event.preventDefault()
  }

  this.blockMenu = event => event.preventDefault()

  onCleanup(() => {
    for (const code of activePointers.values()) keyUp(code)
    activePointers.clear()
  })
</script>

<main class="shell">
  <section class="scene"><slot name="scene"></slot></section>
  <section class="mast"><slot name="mast"></slot></section>
  <aside class="controls"><slot name="controls"></slot></aside>

  <nav class="mobile-gamepad" part="mobile-controls" aria-label="Flight controls" @contextmenu={blockMenu}>
    <div class="dpad" aria-label="Planar thrust">
      <button class="pad up" data-key="KeyW" aria-label="Thrust up" @pointerdown={mobilePress} @pointerup={mobileRelease} @pointercancel={mobileRelease}>↑</button>
      <button class="pad left" data-key="KeyA" aria-label="Thrust left" @pointerdown={mobilePress} @pointerup={mobileRelease} @pointercancel={mobileRelease}>←</button>
      <span class="pad-core" aria-hidden="true"></span>
      <button class="pad right" data-key="KeyD" aria-label="Thrust right" @pointerdown={mobilePress} @pointerup={mobileRelease} @pointercancel={mobileRelease}>→</button>
      <button class="pad down" data-key="KeyS" aria-label="Thrust down" @pointerdown={mobilePress} @pointerup={mobileRelease} @pointercancel={mobileRelease}>↓</button>
    </div>

    <div class="depth" aria-label="Depth thrust">
      <button class="depth-key" data-key="KeyE" aria-label="Thrust forward" @pointerdown={mobilePress} @pointerup={mobileRelease} @pointercancel={mobileRelease}><b>+Z</b><small>IN</small></button>
      <button class="depth-key" data-key="KeyQ" aria-label="Thrust backward" @pointerdown={mobilePress} @pointerup={mobileRelease} @pointercancel={mobileRelease}><b>−Z</b><small>OUT</small></button>
    </div>
  </nav>

  <footer>
    <span>state → typed inputs</span>
    <span>systems → CustomEvent</span>
    <span>fixed Δt = 1/120</span>
    <span>native WebGL2</span>
    <b>design-time world</b>
  </footer>
