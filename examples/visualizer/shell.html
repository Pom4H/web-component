<main class="shell">
  <section class="scene"><slot name="scene"></slot></section>
  <section class="mast"><slot name="mast"></slot></section>
  <aside class="controls"><slot name="controls"></slot></aside>
  <aside class="inspector"><slot name="inspector"></slot></aside>
  <footer>
    <span>properties ↓</span><span>composed events ↑</span><span>native slots</span><span>CSS custom properties</span><b>WebGL2</b>
  </footer>
</main>

<style>
  :host { display:block; min-height:100vh; background:#020408; }
  * { box-sizing:border-box; }
  .shell { position:relative; min-height:100vh; overflow:hidden; background:radial-gradient(circle at 54% 48%,#0b1522 0,#04080e 45%,#010204 86%); }
  .scene { position:absolute; inset:0; min-width:0; min-height:0; }
  .mast { position:absolute; z-index:60; left:30px; top:27px; width:min(690px,62vw); pointer-events:none; }
  .controls { position:absolute; z-index:70; left:29px; bottom:27px; width:290px; }
  .inspector { display:none; }
  footer { position:absolute; z-index:65; left:50%; bottom:27px; translate:-50% 0; display:flex; gap:7px; align-items:center; color:#536276; font:700 8px ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; pointer-events:none; }
  footer span, footer b { border-top:1px solid #142334; padding:8px 7px 0; white-space:nowrap; }
  footer b { color:#78f7d0; }
  @media(max-width:900px){.mast{left:18px;top:18px;width:min(600px,82vw)}.controls{left:18px;bottom:18px;width:250px}footer{display:none}}
  @media(max-width:620px){.mast{width:calc(100vw - 36px)}.controls{width:220px}}
</style>
