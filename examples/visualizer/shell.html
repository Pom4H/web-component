<main class="shell">
  <section class="scene"><slot name="scene"></slot></section>
  <section class="mast"><slot name="mast"></slot></section>
  <aside class="controls"><slot name="controls"></slot></aside>
  <aside class="inspector"><slot name="inspector"></slot></aside>
  <aside class="gamepad"><slot name="gamepad"></slot></aside>
  <footer><span>typed world</span><span>120 Hz physics</span><span>voxel collision</span><span>mine → inventory → craft → place</span></footer>
</main>

<style>
  :host { display:block; min-height:100vh; background:#b9e2ff; }
  * { box-sizing:border-box; }
  .shell { position:relative; min-height:100vh; overflow:hidden; background:linear-gradient(#b9e2ff 0 68%,#d9f0ff); }
  .scene { position:absolute; inset:0; min-width:0; min-height:0; }
  .mast { position:absolute; z-index:50; left:28px; top:26px; width:min(650px,58vw); pointer-events:none; }
  .controls { position:absolute; z-index:70; left:28px; bottom:26px; }
  .inspector { position:absolute; z-index:60; right:24px; top:24px; width:270px; }
  .gamepad { display:none; }
  footer { position:absolute; z-index:45; left:50%; bottom:25px; translate:-50% 0; display:flex; gap:8px; color:#58725d; font:800 8px/1 ui-monospace,monospace; text-transform:uppercase; letter-spacing:.08em; pointer-events:none; }
  footer span { padding-top:7px; border-top:1px solid #7c9c7b88; white-space:nowrap; }
  @media(max-width:1050px){.inspector{display:none}.mast{width:min(650px,72vw)}}
  @media(max-width:800px),(pointer:coarse){
    .shell{height:100dvh;min-height:100dvh}
    .mast,.inspector,footer{display:none}
    .controls{left:50%;top:calc(env(safe-area-inset-top) + 8px);bottom:auto;translate:-50% 0}
    .gamepad{position:absolute;z-index:90;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);display:block;padding:0 14px;pointer-events:none}
  }
</style>
