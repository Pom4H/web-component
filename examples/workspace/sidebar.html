<script>
  input('active', 'Overview')
  this.items = [
    { value:'Overview', glyph:'◫' },
    { value:'Projects', glyph:'◇' },
    { value:'Tasks', glyph:'✓' },
    { value:'Activity', glyph:'↗' }
  ]
  this.nav = computed(() => this.items.map(item => ({ ...item, current:item.value === this.active })))
  this.navigate = event => host.dispatchEvent(new CustomEvent('navigate', { detail:{ value:event.currentTarget.dataset.value }, bubbles:true, composed:true }))
</script>

<nav aria-label="Workspace">
  <a class="brand" href="../">S</a>
  <div class="links">
    <button each={nav} key={value} data-value={value} data-current={current} @click={navigate}>
      <span>{glyph}</span><b>{value}</b>
    </button>
  </div>
  <small>18 components<br>native DOM</small>
</nav>

  :host{display:block;height:100%} nav{height:100%;padding:16px 12px;display:flex;flex-direction:column;gap:26px}.brand{width:38px;height:38px;border-radius:10px;background:#d7ff58;color:#111;display:grid;place-items:center;text-decoration:none;font:900 20px Arial Black}.links{display:grid;gap:6px}button{border:0;background:transparent;color:#818680;text-align:left;padding:10px;border-radius:8px;display:flex;gap:10px;align-items:center;cursor:pointer}button[data-current="true"]{background:#1b1f1b;color:#f6f3ea}button span{width:20px;color:#d7ff58}button b{font:600 12px system-ui}small{margin-top:auto;color:#60655f;font:600 9px/1.5 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}@media(max-width:1000px){button b,small{display:none}nav{align-items:center}.links button{padding:10px}}
</style>
