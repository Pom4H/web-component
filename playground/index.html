<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d0d0c"><title>Playground — Skein</title><meta name="description" content="A tiny one-file Skein editor with live preview and syntax highlighting."><link rel="stylesheet" href="../site/styles.css"><link rel="stylesheet" href="./playground.css"><script type="module" src="./playground.js"></script>
</head><body class="play-body">
<header class="play-head"><a class="play-brand" href="../"><span>S</span><b>Skein</b></a><div class="play-actions"><select id="example" aria-label="Example"></select><label class="auto"><input id="autorun" type="checkbox" checked> auto</label><button id="share">Share</button><button id="run" class="run">Run ↗</button></div></header>
<main class="workspace">
<section class="editor-pane"><div class="pane-head"><div><span class="dot"></span><strong>component.html</strong></div><div class="metrics"><span id="lines">0 lines</span><span id="bytes">0 B</span></div></div><div class="editor-wrap"><pre id="highlight" aria-hidden="true"><code></code></pre><textarea id="source" aria-label="Component source" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea></div><div class="editor-foot"><span>Tab inserts 2 spaces</span><span id="state">ready</span></div></section>
<section class="preview-pane"><div class="pane-head"><div><span class="dot hot"></span><strong>live DOM</strong></div><div><button id="reload" class="icon" aria-label="Reload preview">↻</button><button id="fullscreen" class="icon" aria-label="Fullscreen preview">↗</button></div></div><iframe id="preview" title="Skein preview" sandbox="allow-scripts" allow="autoplay"></iframe><div id="error" class="error" hidden></div></section>
</main>
</body></html>
