<script>
  this.counter = 0;
  this.message = 'Click the button!';
  
  this.increment = () => {
    this.counter++;
    this.message = `Button clicked ${this.counter} time${this.counter !== 1 ? 's' : ''}`;
  };
</script>

<div>
  <h3>Signal-Based Component Demo</h3>
  <p>{message}</p>
  <button onclick="$.increment()">Increment Counter</button>
  <p>Counter: <strong>{counter}</strong></p>
</div>
