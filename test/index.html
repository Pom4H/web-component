<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebComponent tests</title>
  <script type="module" src="../web-component.js"></script>
</head>
<body>
  <test-signals></test-signals>
  <pre id="results">Running…</pre>
  <script>
    const tests = [];
    const test = (name, callback) => tests.push([name, callback]);
    const equal = (actual, expected) => {
      if (actual !== expected) throw new Error(`expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    };
    const tick = () => new Promise(resolve => queueMicrotask(resolve));

    test('text binding', async ({ root, state }) => {
      equal(root.querySelector('#title').textContent, 'Hello 1');
      state.count++;
      await tick();
      equal(root.querySelector('#title').textContent, 'Hello 2');
    });

    test('nested state and attribute binding', async ({ root, state }) => {
      state.user.name = 'Jane';
      await tick();
      equal(root.querySelector('#user').textContent, 'Jane');
      equal(root.querySelector('#user').getAttribute('data-name'), 'user-Jane');
    });

    test('list push', async ({ root, state }) => {
      state.items.push({ name: 'C' });
      await tick();
      equal([...root.querySelectorAll('#items li')].map(node => node.textContent).join(','), 'A,B,C');
    });

    test('list splice', async ({ root, state }) => {
      state.items.splice(1, 1);
      await tick();
      equal([...root.querySelectorAll('#items li')].map(node => node.textContent).join(','), 'A,C');
    });

    test('root state inside nested list', async ({ root, state }) => {
      state.statuses[0].title = 'Ready';
      await tick();
      equal(root.querySelector('option').textContent, 'Ready');
    });

    test('normal for attribute stays normal', ({ root }) => {
      equal(root.querySelector('#label').getAttribute('for'), 'real-input');
    });

    (async () => {
      const host = document.querySelector('test-signals');
      while (!host.shadowRoot?.querySelector('#title') || !window.testState) {
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      const context = { root: host.shadowRoot, state: window.testState };
      const lines = [];
      let failed = 0;

      for (const [name, callback] of tests) {
        try {
          await callback(context);
          lines.push(`✓ ${name}`);
        } catch (error) {
          failed++;
          lines.push(`✗ ${name}\n  ${error.message}`);
        }
      }

      document.querySelector('#results').textContent = lines.join('\n');
      document.body.dataset.tests = failed ? 'failed' : 'passed';
      console.log(`${tests.length - failed}/${tests.length} tests passed`);
    })();
  </script>
</body>
</html>
