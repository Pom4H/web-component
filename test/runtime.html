<script>
  this.count = 1;
  this.name = 'ROOT';
  this.rootLabel = 'ROOT-LABEL';
  this.user = { name: 'John', address: { city: 'Amsterdam' } };
  this.items = [
    { id: 1, name: 'A' },
    { id: 2, name: 'B' },
    { id: 3, name: undefined },
  ];
  this.statuses = [{ id: 'ready', title: 'Ready' }];
  this.primitives = ['A', 'A', 'B'];
  this.show = true;
  this.lifeItems = [{ id: 1 }];
  this.lifeBranch = true;
  this.enabled = true;
  this.inputId = 'real-input';
  this.cssNumber = 12;
  this.cssZero = 0;
  this.cssString = 'rgb(1, 2, 3)';
  this.cssNull = 'null-live';
  this.cssUndefined = 'undefined-live';
  this.cssFalse = 'false-live';
  this.cssOverride = 'binding-wins';
  this.cssInitialNull = null;
  this.cssInitialUndefined = undefined;
  this.cssInitialFalse = false;
  this.total = computed(() => this.count * 2);
  this.increment = () => this.count++;
  effect(() => {
    this.count;
    window.__effectRuns = (window.__effectRuns || 0) + 1;
  });
  onCleanup(() => { window.__cleanupRuns = (window.__cleanupRuns || 0) + 1; });
  window.__state = this;
  window.__host = host;
</script>

<h1 id="title">Hello {count}</h1>
<p id="computed">{total}</p>
<p id="later">{later}</p>
<p id="nested" data-name="user-{user.name}">{user.name}</p>
<p id="city" data-city={user.address.city}>{user.address.city}</p>
<p id="proto">{toString}</p>
<p id="nested-proto">{user.toString}</p>
<label id="native-for" for={inputId}>Name</label>
<input id="real-input" .value={count} ?disabled={enabled}>
<button id="event" @click={increment}>increment</button>
<div
  id="css-properties"
  style="display: block; --static-token: intact; --overridden: static"
  --number={cssNumber}
  --zero={cssZero}
  --string={cssString}
  --nullable={cssNull}
  --undefinable={cssUndefined}
  --falsy={cssFalse}
  --overridden={cssOverride}
  --initial-null={cssInitialNull}
  --initial-undefined={cssInitialUndefined}
  --initial-false={cssInitialFalse}>
</div>
<css-shadow-child
  id="css-shadow-child"
  style="display: block; --child-static: intact"
  --tone={cssString}>
</css-shadow-child>

<ul id="items">
  <li each={items} key={id} data-id={id}>
    <input class="item-input" .value={name}>
    <span class="item-name">{name}</span>
    <span class="item-index">{index}</span>
    <select><option each={statuses} key={id} value={id}>{title}/{rootLabel}</option></select>
  </li>
</ul>
<div id="primitives"><span each={primitives}>{$value}:{index};</span></div>

<section id="branch" if={show}>Visible {count}</section>
<div id="life-list"><row-life each={lifeItems} key={id}></row-life></div>
<section id="life-branch" if={lifeBranch}><row-life></row-life></section>
<row-life id="root-life"></row-life>

<style id="style-test">
  #title { color: rgb(1 2 3); }
  #css-properties {
    width: calc(var(--number) * 1px);
    color: var(--string);
  }
  @supports (display: grid) { #title { display: block; } }
</style>
