<script>
  this.title = 'Hello';
  this.count = 1;
  this.user = { name: 'John' };
  this.items = [{ name: 'A' }, { name: 'B' }];
  this.statuses = [{ title: 'Draft', value: 'draft' }];
</script>

<h1 id="title">{title} {count}</h1>
<p id="user" data-name="user-{user.name}">{user.name}</p>
<ul id="items">
  <li each={items}>{name}</li>
</ul>
<select>
  <option each={statuses} value={value}>{title}</option>
</select>
<label id="label" for="real-input">Label</label>

<script>
  window.testState = this;
</script>
